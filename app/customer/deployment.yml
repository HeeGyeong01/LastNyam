apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/watcher/prometheus'
        prometheus.io/port: '9091'
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: publisher
        image: 941kjw/customer:e709fad
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9091
          name: metrics
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      