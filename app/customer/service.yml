apiVersion: v1
kind: Service
metadata:
  name: customer-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: customer
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: metrics
      protocol: TCP
      port: 9091
      targetPort: 9091