# app/foocketing-publisher/endpoint-kafka.yaml
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: publisher
spec:
  ports:
  - protocol: TCP
    port: 9092
    targetPort: 9092

---
apiVersion: v1
kind: Endpoints
metadata:
  name: kafka-service
  namespace: publisher
subsets:
  - addresses:
      - ip: 10.255.255.1 
    ports:
      - port: 9092