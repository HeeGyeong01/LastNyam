apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: publisher
spec:
  # type을 명시하지 않으면 ClusterIP가 되지만, selector가 없으므로
  # 우리가 직접 Endpoints를 제어하게 됩니다.
  ports:
  - protocol: TCP
    port: 9092
    targetPort: 9092

---

apiVersion: v1
kind: Endpoints
metadata:
  name: kafka-service
  namespace: publisher
subsets:
  - addresses:
      # Kafka가 실행 중인 Master 노드의 VPN IP 주소
      - ip: 10.255.255.1
    ports:
      - port: 9092