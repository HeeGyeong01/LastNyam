apiVersion: v1
kind: Service
metadata:
  name: foocketing-publisher-svc
  namespace: publisher
spec:
  type: ClusterIP
  selector:
    app: foocketing-publisher
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: metrics
      protocol: TCP
      port: 9093
      targetPort: 9093