apiVersion: apps/v1
kind: Deployment
metadata:
  name: foocketing-publisher
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foocketing-publisher
  template:
    metadata:
      labels:
        app: foocketing-publisher
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/watcher/prometheus'
        prometheus.io/port: '9091'
    spec:
      containers:
      - name: publisher
        image: 941kjw/foocketing-publisher:629b7f1
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9091
          name: metrics
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP