apiVersion: apps/v1
kind: Deployment
metadata:
  name: foocketing-publisher
  namespace: publisher
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foocketing-publisher
  template:
    metadata:
      labels:
        app: foocketing-publisher
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/watcher/prometheus'
        prometheus.io/port: '9093'
    spec:
      containers:
      - name: publisher
        image: 941kjw/foocketing-publisher:9d8fe31
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9093
          name: metrics